name: Build BoronEngine

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Check Vulkan SDK
        shell: pwsh
        run: |
          echo "VULKAN_SDK=$env:VULKAN_SDK"
          Test-Path "$env:VULKAN_SDK/Include/vulkan/vulkan.h"
          Test-Path "$env:VULKAN_SDK/Lib/vulkan-1.lib"
          glslangValidator --version

      - name: Configure CMake
          shell: pwsh
          run: |
            echo "VULKAN_SDK=$env:VULKAN_SDK"
            echo "Vulkan header:"
            Get-Item "$env:VULKAN_SDK/Include/vulkan/vulkan.h"

            echo "Vulkan library:"
            Get-Item "$env:VULKAN_SDK/Lib/vulkan-1.lib"

            cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release