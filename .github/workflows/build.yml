name: Build BoronEngine

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Check Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "========== VULKAN SDK =========="
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"

          Write-Host ""
          Write-Host "========== ENV =========="
          Get-ChildItem Env: | Where-Object { $_.Name -like "*VULKAN*" }

          Write-Host ""
          Write-Host "========== VULKAN_SDK CONTENTS =========="
          if ($env:VULKAN_SDK) {
              Get-ChildItem "$env:VULKAN_SDK" -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "========== SEARCHING FOR vulkan.h =========="
          Get-ChildItem "D:\a" -Filter vulkan.h -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 20 FullName

          Write-Host ""
          Write-Host "========== SEARCHING FOR vulkan-1.lib =========="
          Get-ChildItem "D:\a" -Filter vulkan-1.lib -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 20 FullName

      - name: Configure CMake
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"

          cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release