name: Build BoronEngine

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Check Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Write-Host "VULKAN_SDK_VERSION=$env:VULKAN_SDK_VERSION"

          Write-Host ""
          Write-Host "Searching for Vulkan header..."
          $header = Get-ChildItem "D:\a" -Filter vulkan.h -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 10 FullName

          $header | Format-Table -AutoSize

          Write-Host ""
          Write-Host "Searching for Vulkan library..."
          $lib = Get-ChildItem "D:\a" -Filter vulkan-1.lib -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 10 FullName

          $lib | Format-Table -AutoSize

          Write-Host ""
          Write-Host "Searching for glslangValidator..."
          Get-ChildItem "D:\a" -Filter glslangValidator.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 10 FullName |
              Format-Table -AutoSize

      - name: Configure CMake
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release